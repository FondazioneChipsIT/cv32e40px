# MAGIA: this manifest is the FondazioneChipsIT/cv32e40px `chips-it` branch
# (which already fixes the file rename and the missing sources) with the last
# adaptations MAGIA needs applied by `make cv32e40px-patch`:
#   - package renamed `riscv` -> `cv32e40px` so it can coexist with the
#     FondazioneChipsIT/cv32e40p control core (also package `riscv`);
#   - fpnew pointed at cvfpu pulp-v0.1.3 (matches Bender.local and the
#     cv32e40p wrapper), common_cells/tech_cells_generic bumped to what the
#     MAGIA graph resolves;
#   - the instruction tracer wired in the same way as the CV32E40P one.

package:
  name: cv32e40px

dependencies:
  fpnew:              { git: "https://github.com/pulp-platform/cvfpu.git",              rev: "pulp-v0.1.3" }
  common_cells:       { git: "https://github.com/pulp-platform/common_cells.git",       version: 1.21.0    }
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.11    }

sources:
  include_dirs:
    - rtl/include
    - bhv
    - bhv/include
  files:
    - rtl/include/cv32e40px_core_v_xif_pkg.sv
    - rtl/include/cv32e40px_fpu_pkg.sv
    - rtl/include/cv32e40px_apu_core_pkg.sv
    - rtl/include/cv32e40px_pkg.sv
    - rtl/cv32e40px_alu.sv
    - rtl/cv32e40px_alu_div.sv
    - rtl/cv32e40px_aligner.sv
    - rtl/cv32e40px_compressed_decoder.sv
    - rtl/cv32e40px_controller.sv
    - rtl/cv32e40px_cs_registers.sv
    - rtl/cv32e40px_decoder.sv
    - rtl/cv32e40px_int_controller.sv
    - rtl/cv32e40px_ex_stage.sv
    - rtl/cv32e40px_hwloop_regs.sv
    - rtl/cv32e40px_id_stage.sv
    - rtl/cv32e40px_if_stage.sv
    - rtl/cv32e40px_load_store_unit.sv
    - rtl/cv32e40px_mult.sv
    - rtl/cv32e40px_prefetch_buffer.sv
    - rtl/cv32e40px_prefetch_controller.sv
    - rtl/cv32e40px_obi_interface.sv
    - rtl/cv32e40px_core.sv
    - rtl/cv32e40px_apu_disp.sv
    - rtl/cv32e40px_popcnt.sv
    - rtl/cv32e40px_ff_one.sv
    - rtl/cv32e40px_sleep_unit.sv
    - rtl/cv32e40px_fifo.sv
    - rtl/cv32e40px_fp_wrapper.sv
    - rtl/cv32e40px_x_disp.sv
    - rtl/cv32e40px_top.sv
    - target: asic
      files:
        - rtl/cv32e40px_register_file_latch.sv
    - target: not(asic)
      files:
        - rtl/cv32e40px_register_file_ff.sv
    - target: rtl
      files:
        - bhv/cv32e40px_sim_clock_gate.sv
    # Instruction tracer, enabled the same way as the CV32E40P one. The tracer
    # body is guarded by CV32E40P_TRACE_EXECUTION and needs UVM on the include
    # path, exactly like the CV32E40P one.
    - target: all(any(rtl, test, cv32e40px_include_tracer), not(cv32e40px_exclude_tracer))
      defines:
        CV32E40P_TRACE_EXECUTION: ~
      files:
        - bhv/include/cv32e40px_tracer_pkg.sv
        - bhv/cv32e40px_tracer.sv
